name: CI

# Required check for main. Deployment is handled by Cloudflare Workers Builds (docs/deployment.md),
# so this workflow holds no Cloudflare credentials.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Generated API types match the vendored contract
        run: pnpm --filter @heartstone/api-client check:generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Worker bundles (wrangler deploy --dry-run)
        run: |
          for app in citizen government executive admin; do
            pnpm --filter "@heartstone/$app" deploy:check
          done
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high
